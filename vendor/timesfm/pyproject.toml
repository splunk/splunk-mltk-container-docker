# Vendored TimesFM 1.3.0 (PyTorch inference path only). See README.md for origin and
# for every change against the upstream release.

[project]
name = "timesfm"
version = "1.3.0.post1"
description = "Open weights time-series foundation model from Google Research (TimesFM 1.x PyTorch path, vendored for Splunk DSDL)."
readme = "README.md"
# upstream declares <3.12 only because of its jax/paxml/lingvo extras; the PyTorch path runs on 3.12
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Rajat Sen", email = "senrajat@google.com" },
  { name = "Yichen Zhou", email = "yichenzhou@google.com" },
  { name = "Abhimanyu Das", email = "abhidas@google.com" },
  { name = "Petros Mol", email = "pmol@google.com" },
  { name = "Justin Güse", email = "guese.justin@gmail.com" },
  { name = "Michael Chertushkin", email = "chertushkinmichael@gmail.com" },
]
keywords = ["time series", "timesfm", "forecast", "time series model"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
# Exactly what timesfm/__init__.py, timesfm_base.py, timesfm_torch.py and
# pytorch_patched_decoder.py import. Upstream's wandb, typer, absl-py, einshape,
# scikit-learn and huggingface_hub[cli] are only needed by the jax/pax path, the
# finetuning example or the CLI, none of which DSDL ships.
dependencies = [
  "numpy>=1.26.4",
  "pandas>=2.0.0",
  "utilsforecast>=0.1.10",
  "huggingface-hub>=0.23.0",
  "torch>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/google-research/timesfm"
Repository = "https://github.com/google-research/timesfm"

[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"
