# Removed against 5.2.5 (specific_llm_rag.txt + specific_llm_agentic.txt):
# - llama-index (meta package; pins llms-openai<0.8), llama-index-multi-modal-llms-openai,
#   -agent-openai, -program-openai, -question-gen-openai: frozen legacy packages
# - llama-index-llms-gemini, -embeddings-gemini, google-generativeai: final SDK needs protobuf<6,
#   disjoint with TF 2.21 and splunk-opentelemetry 2.x. app/model/llm_utils.py and
#   llm_rag_script_saas_llm.py import the Gemini names from llama_index.llms.google_genai /
#   llama_index.embeddings.google_genai instead (same arguments, GOOGLE_API_KEY).
# - llama-index-llms-vertex, -embeddings-vertex, -vector-stores-vertexaivectorsearch and
#   google-cloud-aiplatform: need aiplatform<2, no import (google-genai covers Vertex)
# - llama-index-vector-stores-databricks, databricks-vectorsearch: protobuf<5/<6, no import
# - llama-index-llms-vllm, -embeddings-vllm (CUDA only), -embeddings-instructor (old sentence-transformers)
# - llama-index-llms-huggingface, -llms-openai-like, -llms-deepseek: no import, force transformers<5
# - llama-index-tools-arxiv, arxiv, feedparser: no import, arxiv 2.x pins requests~=2.32.0
# - llama-index-tools-neo4j, -graph-stores-neo4j, -vector-stores-neo4jvector: no import, neo4j<6
# - aioboto3 as a direct dependency (still installed: bedrock-converse/-embeddings-bedrock 0.12 import it),
#   PyPDF2 (pypdf), mlflow-skinny (mlflow is in dev), langsmith/langgraph-sdk/llama-index-workflows (transitive)
#
# Held back by the llama-index 0.12 integrations (upstream caps, newest allowed release is locked):
# google-genai<2 (llms/embeddings-google-genai 0.2), mcp<2 (tools-mcp 0.2, langchain-mcp-adapters 0.3),
# pymilvus<3 (vector-stores-milvus 0.8), pinecone<8 (vector-stores-pinecone 0.6), striprtf<0.0.27.

[tool.uv]
package = false
# Build backends of the packages built from source (local packages, pure-Python sdists):
# pinned so a build cannot pick up a new backend release silently. uv.lock hashes the
# sdists themselves; these backends are fetched from PyPI by version.
build-constraint-dependencies = ["setuptools==81.0.0", "wheel==0.48.0", "hatchling==1.32.4", "uv-build==0.13.4"]
default-groups = []
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# Overrides replace a requirement everywhere in the graph. Each one lifts a stale cap of a
# llama-index 0.12-line package that has no newer release for core 0.12:
override-dependencies = [
  # aioboto3 15.5 (its last release) pins aiobotocore 2.25.1 -> botocore<1.40.62 and wrapt<2, which
  # excludes splunk-opentelemetry 2.13 (wrapt>=2.5) and current boto3. bedrock-converse 0.7 and
  # embeddings-bedrock 0.5 import aioboto3; it uses only aiobotocore.session/config/context, kept in 3.x
  "aiobotocore>=3.9",
  # readers-file 0.4.x caps pypdf<6 (pypdf 5.9: 49 known CVEs, 10 HIGH); PDFReader only uses
  # PdfReader().pages[i].extract_text(), unchanged in 6.x (readers-file 0.5.2 lifted the cap)
  "pypdf>=6",
  # readers-file 0.4.9-0.4.11 add pandas<2.3 without a code change (0.5.6 lifted it); 0.4.11 carries
  # the defusedxml XXE fix of XMLReader. Same range as the base requirement.
  "pandas>=2.3,<3",
  # llms-openai 0.4.7 caps openai<2; 0.6.8 lifted it to <3 without a code change. openai 2 lets
  # langchain-openai leave 1.1.9 (CVE-2026-41488). <3: openai 3 moved to httpx2 and even llms-openai 0.8
  # caps <3. The 2.45 floor is langchain-openai's own floor, which this override replaces.
  "openai>=2.45,<3",
]
