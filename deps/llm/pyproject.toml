# PyPI is the only default index. The PyTorch index serves torch and nothing else.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
dsdlsupport = { path = "../../package-dsdlsupport" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

# Shared packages that must NOT follow the deps/cpu/uv.lock version, with the reason
# (read by tools/sync-cpu-constraints.py).
[tool.dsdl.cpu-constraints.exclude]
pymilvus = "llama-index-vector-stores-milvus 0.8.x (last for core 0.12) needs pymilvus<3"
boto3 = "aiobotocore (via aioboto3, needed by bedrock-converse 0.7) trails botocore by a few releases"
botocore = "aiobotocore (via aioboto3, needed by bedrock-converse 0.7) trails botocore by a few releases"
multidict = "aiobotocore 3.x caps multidict<7"
