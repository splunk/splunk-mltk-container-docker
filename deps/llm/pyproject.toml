# Dependency profile "llm": the LLM-RAG image ("llm") and the Agentic AI image
# ("agentic", same venv, other app module). Replaces ubi-llm-rag, agentic-ai and
# agentic-ai-debian.
#
# Declare top-level intent only. tools/lock.sh resolves the full, hashed
# closure into uv.lock for linux/amd64 and linux/arm64 at the same time.
# Floors are fine; every upper cap needs a comment with the reason.
#
# base, dev, core, dl and nlp are copies of deps/cpu/pyproject.toml, and every package
# this lock shares with deps/cpu/uv.lock is pinned to the cpu version through the
# generated constraint block below (tools/sync-cpu-constraints.py), so the llm/agentic
# images behave like the cpu image for all classic modules.

[project]
name = "dsdl-llm"
version = "5.3.0"
requires-python = "==3.12.*"
# base: needed by the DSDL API (app/main.py) in every image
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn>=0.30",
  "aiofiles",
  "pyopenssl",
  "cryptography",
  "matplotlib",
  "splunk-sdk",
  "splunk-opentelemetry>=2",
  # pandas 3 switches on copy-on-write and the pyarrow string dtype by default, which
  # changes results of existing user notebooks and persisted models; move in a later minor
  "pandas>=2.3,<3",
  "numpy",
  # rrcf (app/model/random_cut_forest.py) imports pkg_resources, which setuptools 82 removed
  "setuptools>=78.1.1,<82",
  # DSDL helper package from this repository (package-dsdlsupport/)
  "dsdlsupport",
]

[dependency-groups]
# DEV mode: JupyterLab, notebook export (post_save hook), TensorBoard and MLflow UI
dev = [
  "jupyterlab>=4.6",
  "jupyter-server",
  "ipykernel",
  "ipywidgets",
  "widgetsnbextension",
  "jupyterlab-git",
  "nbconvert",
  "nbdime",
  "dask-labextension",
  "tensorboard",
  "mlflow>=3",
  # lets DEV users `pip install` extra packages into /srv/.dsdl/site-packages
  "pip",
]
# classic data science and ML
core = [
  "scipy",
  "scikit-learn",
  "statsmodels",
  "networkx",
  "seaborn",
  "plotly",
  "datashader",
  "dask[dataframe]",
  "dask-ml",
  "prophet",
  # the PyPI "xgboost" wheel depends on nvidia-nccl-cu13; xgboost-cpu has no CUDA payload
  "xgboost-cpu",
  "shap",
  "lime",
  "umap-learn",
  "tslearn",
  "kmodes",
  "imbalanced-learn",
  "stumpy",
  "tqdm",
  "bocd",
  "rrcf",
  "pyod",
  "suod",
  "pomegranate",
  "onnx",
  "onnxscript",
  "onnxruntime",
  "skl2onnx",
  "levenshtein",
