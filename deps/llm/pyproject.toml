  # TF 2.21 and pymilvus ship protobuf 6 generated code; the 7.x runtime only warns today
  # and rejects it in the next major. 6.33.5 is the first 6.x release with all known fixes.
  "protobuf>=6.33.5,<7",
  "grpcio",
]
# deep learning on CPU
dl = [
  "torch",
  "torchmetrics",
  "tensorflow>=2.21",
  # Keras 2 loader for the ESCU DGA SavedModel and binary_nn_classifier_designer
  "tf-keras",
]
# NLP: transformers, Japanese tokenizers, spaCy 3 with its English model
nlp = [
  # stays on 5.x: the LLM integrations that cap transformers<5 (llms-huggingface,
  # llms-openai-like/deepseek) have no import in app/ or notebooks/ and are not installed
  "transformers>=5",
