# PyPI is the only default index. The PyTorch CUDA 12.9 index serves torch and nothing
# else; the nvidia-*-cu12 wheels come from PyPI.
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
# the cu129 index publishes torchvision 0.28.0 (the release for torch 2.13) without a sha256;
# uv.lock records one for a direct URL
torchvision = { url = "https://download-r2.pytorch.org/whl/cu129/torchvision-0.28.0%2Bcu129-cp312-cp312-manylinux_2_28_x86_64.whl" }
dsdlsupport = { path = "../../package-dsdlsupport" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
timesfm = { path = "../../vendor/timesfm" }

# Shared packages that must NOT follow the deps/cpu/uv.lock version, with the reason
# (read by tools/sync-cpu-constraints.py).
[tool.dsdl.cpu-constraints.exclude]
fsspec = "datasets caps fsspec[http] at the last release it tested (5.1.0: <=2026.7.0)"
torch = "2.13 is the newest torch with a CUDA 12.9 build (cu129); the cpu image has 2.14"
