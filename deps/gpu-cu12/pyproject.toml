# Dependency profile "gpu-cu12": the DSDL GPU image (golden-gpu, golden-gpu-transformers).
# linux/x86_64 only. The CUDA 12.9 user space (the CUDA of RAPIDS 26.10 and of the rapids
# profile) comes from the nvidia-*-cu12 wheels that torch and tensorflow[and-cuda] share;
# the image has no OS CUDA and no cuda-compat.
#
# Declare top-level intent only. tools/lock.sh resolves the full, hashed closure into
# uv.lock. Floors are fine; every upper cap needs a comment with the reason.
# base, dev, core and nlp are kept identical to deps/cpu/pyproject.toml, and every
# package shared with the cpu image is pinned to its deps/cpu/uv.lock version through
# constraint-dependencies (see tools/sync-cpu-constraints.py), except the entries of
# [tool.dsdl.cpu-constraints.exclude] (fsspec, torch).

[project]
name = "dsdl-gpu-cu12"
version = "5.2.5"
requires-python = "==3.12.*"
# base: needed by the DSDL API (app/main.py) in every image
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn>=0.30",
  "aiofiles",
  "pyopenssl",
  "cryptography",
  "matplotlib",
  "splunk-sdk",
  "splunk-opentelemetry>=2",
  # FastAPI tracing of the DSDL API when olly_enabled is set (app/main.py setup_tracing)
  "opentelemetry-instrumentation-fastapi",
  # pandas 3 switches on copy-on-write and the pyarrow string dtype by default, which
  # changes results of existing user notebooks and persisted models; move in a later minor
  "pandas>=2.3,<3",
  "numpy",
  # rrcf (app/model/random_cut_forest.py) imports pkg_resources, which setuptools 82 removed
  "setuptools>=78.1.1,<82",
  # DSDL helper package from this repository (package-dsdlsupport/)
  "dsdlsupport",
]

[dependency-groups]
# DEV mode: JupyterLab, notebook export (post_save hook), TensorBoard and MLflow UI
dev = [
  "jupyterlab>=4.6",
  "jupyter-server",
  "ipykernel",
  "ipywidgets",
  "widgetsnbextension",
  "jupyterlab-git",
  "nbconvert",
  "nbdime",
  "dask-labextension",
  "tensorboard",
  "mlflow>=3",
  # lets DEV users `pip install` extra packages into /srv/.dsdl/site-packages
  "pip",
]
# classic data science and ML
core = [
  "scipy",
  "scikit-learn",
  "statsmodels",
  "networkx",
  "seaborn",
  "plotly",
  "datashader",
  "dask[dataframe]",
  "dask-ml",
  "prophet",
  # the PyPI "xgboost" wheel is a CUDA 13 build (nvidia-nccl-cu13); never mix it with
  # the CUDA 12 wheels of this image. xgboost-cpu has no CUDA payload
  "xgboost-cpu",
  "shap",
  "lime",
  "umap-learn",
  "tslearn",
  "kmodes",
  "imbalanced-learn",
  "stumpy",
  "tqdm",
  "bocd",
  "rrcf",
  "pyod",
  "suod",
  "pomegranate",
  "onnx",
  "onnxscript",
  "onnxruntime",
  "skl2onnx",
  "levenshtein",
  "imagehash",
  "boto3",
  "pymilvus",
  "neo4j",
  # TF 2.21 and pymilvus ship protobuf 6 generated code; the 7.x runtime only warns today
  # and rejects it in the next major. 6.33.5 is the first 6.x release with all known fixes.
  "protobuf>=6.33.5,<7",
  "grpcio",
]
# deep learning on CUDA 12.9
dl = [
  # 2.13 is the newest torch with a CUDA 12.9 build: 2.14 has cu126 and CUDA 13 builds only,
  # and 2.15 is planned as CUDA 13 only (pytorch/pytorch#190385). cu129 pins cuda-toolkit
  # 12.9.1, the CUDA that RAPIDS 26.10 is built with (rapidsai/base:26.10-cuda12). Its kernels
  # cover sm_75-sm_120 (Turing to Blackwell); its cuDNN 9.20 pin supports Turing and newer
  # only, which also applies to TensorFlow's cuDNN ops. cu129 is a Linux-only build outside
  # PyTorch's support matrix (pytorch/pytorch#187834) and 2.13 gets no patch releases.
  # TensorFlow's GPU wheels are CUDA 12 only; both must share one set of nvidia-*-cu12
  "torch==2.13.*",
  "torchvision",
  "torchmetrics",
  "tensorflow[and-cuda]>=2.21",
  # Keras 2 loader for the ESCU DGA SavedModel and binary_nn_classifier_designer
  "tf-keras",
]
# NLP: transformers, Japanese tokenizers, spaCy 3 with its English model
nlp = [
  "transformers>=5",
  "sentence-transformers",
  "sentencepiece",
  "tokenizers",
  "nltk",
  "sumeval",
  "janome",
  "fugashi",
  "ipadic",
  "spacy>=3.8",
  "spacytextblob",
  "en-core-web-sm",
]
# GPU extras of golden-gpu-transformers: fine-tuning, quantisation, HF datasets, TimesFM
gpu = [
  "peft",
  "bitsandbytes",
  "accelerate",
  # the floor stops a silent fall-back to datasets 1.x, whose loose metadata "fits" any
  # fsspec; every datasets 5.x release caps fsspec at the newest release it tested
  "datasets>=5",
  "huggingface-hub",
  # TimesFM 1.x PyTorch path used by cisco_tsm_mr, tsfm_forecast, timesfm_multi_resolution
  # and patched_decoder_multi_resolution. PyPI timesfm 1.3.0 requires Python <3.12 and
  # pulls wandb (a Go binary with 120 findings), so it is vendored (vendor/timesfm)
  "timesfm",
]

# Removed against the 5.2.5 test images (no import in app/ or notebooks/, or broken in every image):
# pymc3/theano-pymc, dask-xgboost (forced xgboost 0.90), spaCy 2.3.2/spacytextblob 0.1.7,
# the TF 2.9 pin (broken at import), tf2onnx, wandb/sentry-sdk and yfinance/curl-cffi/peewee
# (pulled by PyPI timesfm 1.3.0), gpustat/blessed/inquirerpy, nvidia-ml-py, einshape,
# dataclasses (obsolete backport), numexpr (no import).

[tool.uv]
package = false
# Build backends of the packages built from source (local packages, pure-Python sdists):
# pinned so a build cannot pick up a new backend release silently. uv.lock hashes the
# sdists themselves; these backends are fetched from PyPI by version.
build-constraint-dependencies = ["setuptools==81.0.0", "wheel==0.48.0", "hatchling==1.32.4", "uv-build==0.13.4"]
default-groups = []
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Same versions as the cpu image for every shared package: one CVE answer per package
# across images and identical behaviour of user notebooks and persisted models.
