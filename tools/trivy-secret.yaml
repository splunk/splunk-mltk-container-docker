# Trivy secret-scan allow rules for tools/scan.sh. Every entry needs a reason.
allow-rules:
  - id: dsdl-phishing-sample-data
    description: >-
      notebooks/data/train.csv is a public phishing-URL dataset used by the example
      notebooks; the "JWT" is part of a lowercased phishing URL, not a credential.
    path: .*/dltk/notebooks/data/train\.csv
  - id: scikit-image-sample-urls
    description: >-
      scikit-image sample-data download URLs embed public access tokens of its data mirror.
    path: .*/site-packages/skimage/data/_fetchers\.py
  - id: anthropic-sdk-docstrings
    description: >-
      Docstrings of the Anthropic Python SDK (beta agents API) contain an example JSON
      object that matches the GCP service-account pattern; there is no credential.
    path: .*/site-packages/anthropic/(resources|types)/beta/.*
